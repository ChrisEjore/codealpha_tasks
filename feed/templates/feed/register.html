<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Beatz</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .register-card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 360px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ccff00;
        }
        p {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        .helptext, .errorlist {
            font-size: 12px;
            color: #aaa;
            margin-top: 4px;
        }
        .errorlist {
            color: #ff5555;
            list-style: none;
            padding: 0;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ccff00;
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #b3e600;
        }
        .auth-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .auth-link a {
            color: #ccff00;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2>Join Beatz</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <div class="auth-link">
        Already have an account? <a href="{% url 'login' %}">Log In</a>
    </div>
</div>

</body>
</html>
